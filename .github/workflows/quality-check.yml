name: Quality Check Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore QualityCheckDemo.sln

      - name: Build solution
        run: dotnet build QualityCheckDemo.sln --configuration Release --no-restore

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore QualityCheckDemo.sln

      - name: Run tests with coverage
        run: dotnet test tests/QualityCheckDemo.Tests/QualityCheckDemo.Tests.csproj --configuration Release --no-restore --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.*

      - name: Generate HTML coverage report
        run: reportgenerator -reports:coverage/**/*.xml -targetdir:coverage/html -reporttypes:Html

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/html

  lint:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore QualityCheckDemo.sln

      - name: Run linter
        run: dotnet format QualityCheckDemo.sln --verify-no-changes --no-restore

  secret-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Validate secret exists
        run: |
          if [ -z "$API_TOKEN" ]; then
            echo "API_TOKEN is missing"
            exit 1
          fi

          echo "Secret found"
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}