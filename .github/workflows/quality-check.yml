name: Quality Check Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore QualityCheckDemo.sln

      - name: Build solution
        run: dotnet build QualityCheckDemo.sln --configuration Release --no-restore

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore QualityCheckDemo.sln

      - name: Run tests
        run: dotnet test tests/QualityCheckDemo.Tests/QualityCheckDemo.Tests.csproj --configuration Release --no-restore --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  lint:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore QualityCheckDemo.sln

      - name: Run linter
        run: dotnet format QualityCheckDemo.sln --verify-no-changes --no-restore

  secret-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Use secret
        run: echo "Using secret token"
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}